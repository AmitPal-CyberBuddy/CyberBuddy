# Publish the static hub + tool pages to GitHub Pages.
# One-time: repo Settings → Pages → Source = GitHub Actions.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site/css _site/js _site/tools
          cp index.html _site/
          touch _site/.nojekyll
          test -f 404.html && cp 404.html _site/ || true
          cp css/app.css _site/css/
          cp js/app.js _site/js/
          cp -a tools/clickjacking tools/headers tools/cors _site/tools/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
